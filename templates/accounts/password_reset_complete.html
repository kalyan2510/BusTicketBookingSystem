{% extends "base.html" %}
{% load static %}

{% block title %}Password updated — BUSGO{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container-xxl">
    <div class="auth-simple-card text-center">
      <div class="result-icon success mb-3" style="width:80px;height:80px;font-size:2rem;margin:0 auto 18px;"><i class="fa-solid fa-lock-open"></i></div>
      <h1 class="h3">Password updated</h1>
      <p class="text-muted">Your password has been changed successfully. Sign in with your new password to continue.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-brand mt-2"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
